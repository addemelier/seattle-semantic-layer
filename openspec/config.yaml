schema: spec-driven

context: |
  A live, shareable Redfin-style map of open Seattle building permits: search an address, see what
  could get built nearby, click a permit for details. The dbt medallion (DuckLake) and a semantic
  layer are built to serve the app; anonymous engagement events flow back into the same warehouse.
  Built on Seattle open data.
  Read CLAUDE.md for modes and the APPROVED / BLOCKED.md protocol.

rules:
  proposal:
    - State what is out of scope.
    - Name which eval questions (by number in docs/eval-questions.md) this change enables or affects, if any.
  design:
    - Record every decision the PM made in the session, with the reason, so the builder never has to guess.
    - List open questions explicitly; a change with open questions must not be marked APPROVED.
  tasks:
    - Each task is 15-45 minutes of agent work, one concern, one commit.
    - Each task ends with a verification command that exits 0 on success.
    - Name the files, models and tables each task creates or changes.

operations:
  apply:
    guidance:
      - Unattended runs never edit proposal.md, design.md or specs; write BLOCKED.md instead (see CLAUDE.md).
      - Run each task's verification command before checking it off.
